
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAULI MOBILE SHOP</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#222;
}
header{
 background:#101c36;
 color:white;
 text-align:center;
 padding:25px 12px;
}
header h1{margin:5px;font-size:27px}
header p{margin:8px}
.top{
 background:#fff;
 padding:12px;
 position:sticky;
 top:0;
 z-index:5;
 box-shadow:0 2px 5px #ccc;
}
input,select{
 width:100%;
 padding:13px;
 border:1px solid #ccc;
 border-radius:8px;
 font-size:16px;
 margin:5px 0;
}
.categories{
 display:flex;
 overflow-x:auto;
 gap:8px;
 padding:12px;
}
.categories button{
 white-space:nowrap;
 border:0;
 padding:11px 15px;
 border-radius:20px;
 background:#ddd;
}
.categories button.active{
 background:#101c36;
 color:white;
}
h2{text-align:center}
.products{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 padding:12px;
}
.card{
 background:white;
 padding:15px 8px;
 border-radius:12px;
 text-align:center;
 box-shadow:0 2px 7px #ddd;
}
.product-icon{font-size:42px}
.card h3{font-size:16px;min-height:38px}
.price{color:#087b32;font-weight:bold}
button{
 cursor:pointer;
}
.add{
 background:#07852b;
 color:white;
 border:0;
 padding:11px 10px;
 border-radius:7px;
 width:100%;
 margin-top:8px;
}
.cart{
 background:white;
 margin:12px;
 padding:16px;
 border-radius:12px;
}
.cart-item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 padding:10px 0;
 border-bottom:1px solid #ddd;
}
.qty button{
 padding:5px 10px;
}
.order{
 background:#101c36;
 color:white;
 border:0;
 width:100%;
 padding:15px;
 border-radius:8px;
 font-size:17px;
 margin-top:10px;
}
footer{
 background:#101c36;
 color:white;
 text-align:center;
 padding:25px;
 margin-top:20px;
}
</style>
</head>

<body>

<header>
<h1>MAULI MOBILE SHOP</h1>
<p>Mobile Repairing & Accessories</p>
<p>📍 Gowari, Mouda, Nagpur</p>
<p>📞 9022459180</p>
</header>

<div class="top">
<input id="search" placeholder="🔍 वस्तू शोधा..."
oninput="showProducts()">
</div>

<h2>🛍️ आमचे Products</h2>

<div class="categories" id="categories"></div>

<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 Your Shopping Cart</h2>
<div id="cartItems">Cart रिकामी आहे.</div>
<h3 id="total">एकूण: किंमत विचारण्यासाठी</h3>

<input id="customer" placeholder="तुमचे नाव">
<input id="address" placeholder="पत्ता / गाव">

<select id="payment">
<option value="COD">Cash on Delivery (COD)</option>
<option value="UPI">UPI Payment</option>
</select>

<button class="order" onclick="placeOrder()">
📲 WhatsApp वर Order करा
</button>
</div>

<footer>
<h3>MAULI MOBILE SHOP</h3>
<p>Mobile Repairing & Accessories</p>
<p>All Electronics Items Available</p>
<p>Contact: 9022459180</p>
</footer>

<script>

const categories = [
"All",
"Mobile Accessories",
"Chargers & Cables",
"Earphones",
"LED Lights",
"Mobile Repairing",
"DTH & Remote",
"Speakers",
"Electronics",
"Mobile Phone"
];

const products = [
{name:"Mobile Cover",cat:"Mobile Accessories",icon:"📱"},
{name:"Tempered Glass",cat:"Mobile Accessories",icon:"🛡️"},
{name:"Mobile Charger",cat:"Chargers & Cables",icon:"🔌"},
{name:"USB Data Cable",cat:"Chargers & Cables",icon:"🔗"},
{name:"Bluetooth Earphones",cat:"Earphones",icon:"🎧"},
{name:"Wired Earphones",cat:"Earphones",icon:"🎵"},
{name:"LED Bulb",cat:"LED Lights",icon:"💡"},
{name:"LED Tube Light",cat:"LED Lights",icon:"💡"},
{name:"Mobile Repairing Service",cat:"Mobile Repairing",icon:"🔧"},
{name:"DTH Setup Box",cat:"DTH & Remote",icon:"📺"},
{name:"TV Remote",cat:"DTH & Remote",icon:"🎮"},
{name:"Bluetooth Speaker",cat:"Speakers",icon:"🔊"},
{name:"Home Speaker",cat:"Speakers",icon:"📢"},
{name:"Electronic Switch",cat:"Electronics",icon:"⚡"},
{name:"Electronic Accessories",cat:"Electronics",icon:"🔋"},
{name:"Smartphone",cat:"Mobile Phone",icon:"📱"}
];

let selected="All";
let cart=[];

function showCategories(){
 document.getElementById("categories").innerHTML=
 categories.map(c=>
 `<button class="${selected===c?'active':''}"
 onclick="selectCategory('${c}')">${c}</button>`
 ).join("");
}

function selectCategory(c){
 selected=c;
 showCategories();
 showProducts();
}

function showProducts(){
 let q=document.getElementById("search").value.toLowerCase();

 let list=products.filter(p=>
 (selected==="All"||p.cat===selected) &&
 (p.name.toLowerCase().includes(q)||
 p.cat.toLowerCase().includes(q))
 );

 document.getElementById("products").innerHTML=
 list.map((p,i)=>`
 <div class="card">
 <div class="product-icon">${p.icon}</div>
 <h3>${p.name}</h3>
 <p class="price">किंमत विचारण्यासाठी</p>
 <button class="add"
 onclick="addCart('${p.name.replace(/'/g,"\\'")}')">
 Add to Cart +
 </button>
 </div>
 `).join("") || "<p>उत्पादन सापडले नाही.</p>";
}

function addCart(name){
 let item=cart.find(x=>x.name===name);
 if(item){item.qty++;}
 else{cart.push({name:name,qty:1});}
 showCart();
}

function changeQty(name,n){
 let item=cart.find(x=>x.name===name);
 if(!item)return;
 item.qty+=n;
 if(item.qty<=0){
 cart=cart.filter(x=>x.name!==name);
 }
 showCart();
}

function showCart(){
 let el=document.getElementById("cartItems");

 if(cart.length===0){
 el.innerHTML="Cart रिकामी आहे.";
 }else{
 el.innerHTML=cart.map(x=>`
 <div class="cart-item">
 <span>${x.name}</span>
 <span class="qty">
 <button onclick="changeQty('${x.name.replace(/'/g,"\\'")}',-1)">−</button>
 ${x.qty}
 <button onclick="changeQty('${x.name.replace(/'/g,"\\'")}',1)">+</button>
 </span>
 </div>
 `).join("");
 }
 document.getElementById("total").innerText=
 "एकूण: किंमत WhatsApp वर कळवली जाईल.";
}

function placeOrder(){
 if(cart.length===0){
 alert("कृपया आधी Product निवडा.");
 return;
 }

 let name=document.getElementById("customer").value.trim();
 let address=document.getElementById("address").value.trim();
 let payment=document.getElementById("payment").value;

 if(!name||!address){
 alert("कृपया तुमचे नाव आणि पत्ता भरा.");
 return;
 }

 let message=
 "नमस्कार MAULI MOBILE SHOP! मला Order द्यायची आहे.%0A%0A"+
 "Customer: "+encodeURIComponent(name)+"%0A"+
 "Address: "+encodeURIComponent(address)+"%0A%0A"+
 "Products:%0A"+
 cart.map(x=>encodeURIComponent(x.name+
 " x "+x.qty)).join("%0A")+
 "%0A%0APayment: "+payment+
 "%0Aकृपया किंमत आणि उपलब्धता कळवा.";

 window.open(
 "https://wa.me/919022459180?text="+message,
 "_blank"
 );
}

showCategories();
showProducts();
showCart();

</script>
</body>
</html>
