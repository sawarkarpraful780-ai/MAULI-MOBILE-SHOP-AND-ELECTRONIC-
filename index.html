
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAULI MOBILE SHOP</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f3f6;color:#222}
header{background:#101c36;color:white;text-align:center;padding:25px 12px}
header h1{font-size:27px}
.top{background:white;padding:12px;position:sticky;top:0;z-index:5}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{cursor:pointer;border:0;border-radius:8px;padding:11px}
.admin-btn{background:#f0a500;color:#111;width:100%;font-weight:bold}
.panel,.cart{background:white;margin:12px;padding:15px;border-radius:12px}
.hidden{display:none}
.categories{display:flex;overflow-x:auto;gap:8px;padding:12px}
.categories button{white-space:nowrap;background:#ddd}
.categories .active{background:#101c36;color:white}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 7px #ddd;min-width:0}
.card img{width:100%;height:115px;object-fit:contain}
.emoji{font-size:48px;height:115px;display:flex;align-items:center;justify-content:center}
.price{color:green;font-size:19px;font-weight:bold}
.add{background:#07852b;color:white;width:100%}
.save{background:#101c36;color:white;width:100%;margin-top:8px}
.delete{background:#c62828;color:white;margin-top:8px}
.row{display:flex;gap:6px;align-items:center}
.row input{min-width:0}
.cart-item{padding:10px 0;border-bottom:1px solid #ddd}
.order{background:#07852b;color:white;width:100%;font-size:17px;margin-top:10px}
.pay{background:#1769aa;color:white;width:100%;margin-top:8px}
footer{background:#101c36;color:white;text-align:center;padding:25px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>

<header>
<h1>MAULI MOBILE SHOP</h1>
<p>Mobile Repairing & Accessories</p>
<p>📍 Gowari, Mouda, Nagpur</p>
<p>📞 9022459180</p>
</header>

<div class="top">
<input id="search" placeholder="🔍 वस्तू शोधा..." oninput="showProducts()">
</div>

<div class="panel">
<button class="admin-btn" onclick="adminLogin()">🔐 ADMIN PANEL</button>
</div>

<section id="admin" class="panel hidden">
<h2>⚙️ Admin Dashboard</h2>
<p class="small">इथे प्रत्येक वस्तूची किंमत बदला.</p>

<div id="priceEditor"></div>
<button class="save" onclick="savePrices()">💾 Save All Prices</button>

<hr>
<h3>➕ नवीन Product जोडा</h3>
<input id="newName" placeholder="Product Name">
<select id="newCat"></select>
<input id="newPrice" type="number" min="0" placeholder="विक्री किंमत ₹">
<input id="newImage" placeholder="Photo URL (ऐच्छिक)">
<button class="save" onclick="addProduct()">Add Product</button>
<button class="delete" onclick="adminLogout()">Admin बंद करा</button>
</section>

<h2 style="text-align:center">🛍️ आमचे Products</h2>
<div class="categories" id="categories"></div>
<div class="products" id="products"></div>

<section class="cart">
<h2>🛒 Shopping Cart</h2>
<div id="cartItems">Cart रिकामी आहे.</div>
<h3 id="total">Total: ₹0</h3>

<input id="customer" placeholder="ग्राहकाचे नाव">
<input id="address" placeholder="पूर्ण पत्ता">

<select id="payment">
<option value="COD">Cash on Delivery</option>
<option value="UPI">UPI Payment</option>
</select>

<button class="pay" onclick="payUPI()">Pay with UPI</button>
<button class="order" onclick="placeOrder()">📲 WhatsApp वर Order करा</button>
</section>

<footer>
<h3>MAULI MOBILE SHOP</h3>
<p>Mobile Repairing & Accessories</p>
<p>Contact: 9022459180</p>
</footer>

<script>
const UPI_ID="9022459180@ybl";
const WHATSAPP="919022459180";
const PIN="1234";

const cats=[
"Mobile Accessories","Chargers & Cables","Earphones",
"LED Lights","Mobile Repairing","DTH & Remote",
"Speakers","Electronics","Mobile Phone"
];

const defaultProducts=[
["Mobile Cover","Mobile Accessories","📱"],
["Tempered Glass","Mobile Accessories","🛡️"],
["Mobile Charger","Chargers & Cables","🔌"],
["USB Data Cable","Chargers & Cables","🔗"],
["Bluetooth Earphones","Earphones","🎧"],
["Wired Earphones","Earphones","🎵"],
["LED Bulb","LED Lights","💡"],
["LED Tube Light","LED Lights","💡"],
["Mobile Repairing Service","Mobile Repairing","🔧"],
["DTH Setup Box","DTH & Remote","📺"],
["TV Remote","DTH & Remote","🎮"],
["Bluetooth Speaker","Speakers","🔊"],
["Home Speaker","Speakers","📢"],
["Electronic Switch","Electronics","⚡"],
["Electronic Accessories","Electronics","🔋"],
["Smartphone","Mobile Phone","📱"]
];

function loadProducts(){
 try{
 const saved=localStorage.getItem("mauliProducts");
 if(saved)return JSON.parse(saved);
 }catch(e){}
 return defaultProducts.map((p,i)=>({
 id:i+1,name:p[0],cat:p[1],icon:p[2],price:null,image:""
 }));
}

let products=loadProducts();
let cart=[];
let selected="All";
let isAdmin=false;

function saveData(){
 localStorage.setItem("mauliProducts",JSON.stringify(products));
}

function esc(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function adminLogin(){
 if(isAdmin){adminLogout();return;}
 let pin=prompt("Admin PIN टाका:");
 if(pin===PIN){
 isAdmin=true;
 document.getElementById("admin").classList.remove("hidden");
 renderEditor();
 }else if(pin!==null){
 alert("चुकीचा PIN!");
 }
}

function adminLogout(){
 isAdmin=false;
 document.getElementById("admin").classList.add("hidden");
}

function renderEditor(){
 document.getElementById("priceEditor").innerHTML=
 products.map(p=>`
 <div class="cart-item">
 <b>${esc(p.name)}</b>
 <div class="row">
 <input type="number" min="0" placeholder="किंमत ₹"
 data-price-id="${p.id}" value="${p.price??''}">
 <button class="delete" onclick="removeProduct(${p.id})">Delete</button>
 </div>
 </div>`).join("");
}

function savePrices(){
 document.querySelectorAll("[data-price-id]").forEach(el=>{
 let p=products.find(x=>x.id===Number(el.dataset.priceId));
 if(p){
 p.price=el.value===""?null:Number(el.value);
 }
 });
 saveData();
 showProducts();
 renderEditor();
 alert("सर्व किंमती सेव्ह झाल्या!");
}

function addProduct(){
 if(!isAdmin)return;
 let name=document.getElementById("newName").value.trim();
 let cat=document.getElementById("newCat").value;
 let price=document.getElementById("newPrice").value;
 let image=document.getElementById("newImage").value.trim();

 if(!name||price===""||Number(price)<0){
 alert("Product नाव आणि योग्य किंमत भरा.");
 return;
 }
 if(image&&!image.startsWith("https://")){
 alert("Photo URL https:// ने सुरू होणारा असावा.");
 return;
 }

 products.push({
 id:Date.now(),name:name,cat:cat,
 price:Number(price),image:image,icon:"🛍️"
 });

 saveData();
 showProducts();
 renderEditor();

 document.getElementById("newName").value="";
 document.getElementById("newPrice").value="";
 document.getElementById("newImage").value="";
 alert("नवीन Product जोडला!");
}

function removeProduct(id){
 if(!isAdmin||!confirm("हा Product काढायचा आहे?"))return;
 products=products.filter(p=>p.id!==id);
 cart=cart.filter(x=>x.id!==id);
 saveData();
 showProducts();
 showCart();
 renderEditor();
}

function showCategories(){
 document.getElementById("categories").innerHTML=
 ["All",...cats].map(c=>`
 <button class="${selected===c?'active':''}"
 onclick="selectCategory('${c}')">${esc(c)}</button>
 `).join("");
}

function selectCategory(c){
 selected=c;
 showCategories();
 showProducts();
}

function showProducts(){
 let q=document.getElementById("search").value.toLowerCase();
 let list=products.filter(p=>
 (selected==="All"||p.cat===selected)&&
 (p.name.toLowerCase().includes(q)||
 p.cat.toLowerCase().includes(q))
 );

 document.getElementById("products").innerHTML=
 list.map(p=>`
 <div class="card">
 ${p.image?
 `<img src="${esc(p.image)}" alt="${esc(p.name)}">`:
 `<div class="emoji">${esc(p.icon)}</div>`}
 <h3>${esc(p.name)}</h3>
 <p class="price">${p.price===null?
 "किंमत उपलब्ध नाही":"₹"+p.price}</p>
 <button class="add" onclick="addCart(${p.id})"
 ${p.price===null?"disabled":""}>
 Add to Cart +
 </button>
 </div>`).join("")||"<p>Product सापडला नाही.</p>";
}

function addCart(id){
 let p=products.find(x=>x.id===id);
 if(!p||p.price===null)return;
 let item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({id:id,qty:1});
 showCart();
}

function changeQty(id,n){
 let item=cart.find(x=>x.id===id);
 if(!item)return;
 item.qty+=n;
 if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
 showCart();
}

function getTotal(){
 return cart.reduce((sum,x)=>{
 let p=products.find(y=>y.id===x.id);
 return sum+(p?p.price*x.qty:0);
 },0);
}

function showCart(){
 let el=document.getElementById("cartItems");
 if(!cart.length)el.innerHTML="Cart रिकामी आहे.";
 else el.innerHTML=cart.map(x=>{
 let p=products.find(y=>y.id===x.id);
 if(!p)return "";
 return `<div class="cart-item">
 ${esc(p.name)} — ₹${p.price} × ${x.qty}
 <button onclick="changeQty(${x.id},-1)">−</button>
 <button onclick="changeQty(${x.id},1)">+</button>
 </div>`;
 }).join("");

 document.getElementById("total").innerText="Total: ₹"+getTotal();
}

function orderMessage(){
 let name=document.getElementById("customer").value.trim();
 let address=document.getElementById("address").value.trim();
 if(!cart.length){alert("आधी Product निवडा.");return null;}
 if(!name||!address){
 alert("नाव आणि पत्ता भरा.");return null;
 }

 let lines=cart.map(x=>{
 let p=products.find(y=>y.id===x.id);
 return p.name+" x "+x.qty+" = Rs."+p.price*x.qty;
 }).join("\n");

 return "MAULI MOBILE SHOP ORDER\n"+
 "Name: "+name+"\nAddress: "+address+
 "\n\n"+lines+"\n\nTotal: Rs."+getTotal()+
 "\nPayment: "+document.getElementById("payment").value;
}

function placeOrder(){
 let msg=orderMessage();
 if(!msg)return;
 window.open("https://wa.me/"+WHATSAPP+
 "?text="+encodeURIComponent(msg),"_blank");
}

function payUPI(){
 let msg=orderMessage();
 if(!msg)return;
 let total=getTotal();
 if(total<=0){alert("किंमत तपासा.");return;}
 let url="upi://pay?pa="+encodeURIComponent(UPI_ID)+
 "&pn=MAULI%20MOBILE%20SHOP&am="+total+
 "&cu=INR&tn="+encodeURIComponent("Mobile Shop Order");
 window.location.href=url;
}

document.getElementById("newCat").innerHTML=
 cats.map(c=>`<option>${esc(c)}</option>`).join("");

showCategories();
showProducts();
showCart();
</script>
</body>
</html>
